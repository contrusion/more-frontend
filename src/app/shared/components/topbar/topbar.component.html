<nav class="topbar">
  <div class="topbar-container">
    <!-- Left Section: Logo & Breadcrumbs -->
    <div class="topbar-left">
      <div class="logo" (click)="navigateTo('/home')">
        <svg viewBox="0 0 40 40" class="logo-icon">
          <rect x="2" y="2" width="14" height="14" rx="2" fill="#0ea5e9" opacity="0.8"/>
          <rect x="18" y="2" width="20" height="20" rx="2" fill="#0ea5e9" opacity="0.6"/>
          <rect x="2" y="18" width="20" height="20" rx="2" fill="#0ea5e9" opacity="0.9"/>
          <rect x="24" y="24" width="14" height="14" rx="2" fill="#0ea5e9"/>
        </svg>
        <span class="logo-text">More</span>
      </div>

      <div class="breadcrumbs" *ngIf="breadcrumbs.length > 0">
        <svg class="breadcrumb-separator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"/>
        </svg>
        <ng-container *ngFor="let breadcrumb of breadcrumbs; let last = last">
          <a 
            *ngIf="!last" 
            [routerLink]="breadcrumb.url" 
            class="breadcrumb-link">
            {{ breadcrumb.label }}
          </a>
          <span *ngIf="last" class="breadcrumb-current">
            {{ breadcrumb.label }}
          </span>
          <svg 
            *ngIf="!last" 
            class="breadcrumb-separator" 
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </ng-container>
      </div>
    </div>

    <!-- Right Section: Notifications & Profile -->
    <div class="topbar-right">
      <!-- Notifications -->
      <div class="notifications-dropdown">
        <button 
          class="icon-btn" 
          (click)="toggleNotifications()"
          [class.active]="isNotificationsOpen"
          aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span *ngIf="notificationCount > 0" class="notification-badge">{{ notificationCount }}</span>
        </button>

        <div class="dropdown-menu notifications-menu" *ngIf="isNotificationsOpen">
          <div class="dropdown-header">
            <h3>Notifications</h3>
          </div>
          <div class="dropdown-body">
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
              <p>No new notifications</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Profile Dropdown -->
      <div class="profile-dropdown">
        <button 
          class="profile-btn" 
          (click)="toggleProfileMenu()"
          [class.active]="isProfileMenuOpen"
          aria-label="Profile menu">
          <div class="avatar">
            <span>{{ getUserInitials() }}</span>
          </div>
          <div class="profile-info">
            <span class="profile-name">{{ userName }}</span>
            <span class="profile-role" *ngIf="userRoles.length > 0">{{ userRoles[0] }}</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>

        <div class="dropdown-menu profile-menu" *ngIf="isProfileMenuOpen">
          <div class="dropdown-header">
            <div class="menu-avatar">{{ getUserInitials() }}</div>
            <div class="menu-user-info">
              <p class="menu-user-name">{{ userName }}</p>
              <p class="menu-user-email">{{ userEmail }}</p>
            </div>
          </div>
          
          <div class="dropdown-divider"></div>
          
          <div class="dropdown-body">
            <button class="dropdown-item" (click)="goToProfile()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <span>My Profile</span>
            </button>
            
            <button class="dropdown-item" (click)="goToSettings()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M5.64 18.36l4.24-4.24m4.24-4.24l4.24-4.24"/>
              </svg>
              <span>Settings</span>
            </button>
          </div>
          
          <div class="dropdown-divider"></div>
          
          <div class="dropdown-footer">
            <button class="dropdown-item logout-item" (click)="logout()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Click overlay to close dropdowns -->
<div 
  class="dropdown-overlay" 
  *ngIf="isProfileMenuOpen || isNotificationsOpen"
  (click)="closeMenus()">
</div>
