<section class="relationship-page">
  <header class="relationship-header">
    <div class="relationship-header__content">
      <h1>{{ title }}</h1>
      <p class="relationship-subtitle">{{ description }}</p>
    </div>
  </header>

  <main class="relationship-body">
    <div class="relationship-empty">
      <div class="relationship-empty__icon" aria-hidden="true">👥</div>
      <h2>{{ emptyStateMessage }}</h2>
      <p>Use the leads queue and reconnect flow to start building your network.</p>
    </div>
  </main>
</section>
