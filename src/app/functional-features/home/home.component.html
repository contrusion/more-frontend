<!-- Sidebar -->
<div class="sidebar" [class.open]="isSidebarOpen">
  <div class="sidebar-header">
    <div class="logo">
      <svg viewBox="0 0 40 40" class="logo-icon">
        <rect x="2" y="2" width="14" height="14" rx="2" fill="#0ea5e9" opacity="0.8"/>
        <rect x="18" y="2" width="20" height="20" rx="2" fill="#0ea5e9" opacity="0.6"/>
        <rect x="2" y="18" width="20" height="20" rx="2" fill="#0ea5e9" opacity="0.9"/>
        <rect x="24" y="24" width="14" height="14" rx="2" fill="#0ea5e9"/>
      </svg>
      <span>More</span>
    </div>
    <button class="close-btn" (click)="toggleSidebar()" aria-label="Close sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <a *ngFor="let tile of getVisibleTiles()" 
       (click)="navigateTo(tile.route)"
       class="nav-item">
      <span class="nav-icon" [style.color]="tile.color">•</span>
      <span>{{ tile.title }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Logout</span>
    </button>
  </div>
</div>

<!-- Overlay -->
<div class="overlay" [class.active]="isSidebarOpen" (click)="toggleSidebar()"></div>

<!-- Main Content -->
<div class="home-container">
  <!-- Menu Button (Mobile) -->
  <button class="mobile-menu-btn" (click)="toggleSidebar()" aria-label="Open menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <!-- Welcome Section -->
  <section class="welcome-section">
    <div class="welcome-gradient"></div>
    <div class="welcome-content">
      <div class="welcome-left">
        <h1 class="welcome-title">Welcome Back, {{ userName }}!</h1>
        <p class="welcome-subtitle">{{ userEmail }}</p>
        <div class="user-bio" *ngIf="userBio">
          <p>{{ userBio }}</p>
        </div>
        <div class="user-meta">
          <span *ngIf="userJobTitle" class="meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
            {{ userJobTitle }}
          </span>
          <span *ngIf="userRoles.length > 0" class="meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            {{ userRoles.join(', ') }}
          </span>
        </div>
      </div>

      <div class="welcome-right">
        <div class="info-cards">
          <div class="info-card">
            <div class="info-card-icon" style="background: rgba(14, 165, 233, 0.15);">
              <svg viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
              </svg>
            </div>
            <div class="info-card-content">
              <p class="info-card-label">Active Interactions</p>
              <p class="info-card-value">12</p>
            </div>
          </div>

          <div class="info-card">
            <div class="info-card-icon" style="background: rgba(139, 92, 246, 0.15);">
              <svg viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </div>
            <div class="info-card-content">
              <p class="info-card-label">Upcoming Interviews</p>
              <p class="info-card-value">3</p>
            </div>
          </div>

          <div class="info-card">
            <div class="info-card-icon" style="background: rgba(16, 185, 129, 0.15);">
              <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
              </svg>
            </div>
            <div class="info-card-content">
              <p class="info-card-label">New Opportunities</p>
              <p class="info-card-value">8</p>
            </div>
          </div>

          <div class="info-card">
            <div class="info-card-icon" style="background: rgba(236, 72, 153, 0.15);">
              <svg viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </div>
            <div class="info-card-content">
              <p class="info-card-label">Connections</p>
              <p class="info-card-value">24</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Navigation Tiles -->
  <section class="tiles-section">
    <h2 class="section-title">Quick Access</h2>
    <div class="tiles-grid">
      <div *ngFor="let tile of getVisibleTiles()" 
           class="tile"
           (click)="navigateTo(tile.route)"
           [style.--tile-color]="tile.color">
        <div class="tile-icon">
          <svg *ngIf="tile.icon === 'clipboard'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
          </svg>
          <svg *ngIf="tile.icon === 'calendar'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <svg *ngIf="tile.icon === 'briefcase'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
          <svg *ngIf="tile.icon === 'search'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <svg *ngIf="tile.icon === 'video'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="2" y="5" width="14" height="14" rx="2" ry="2"/>
          </svg>
          <svg *ngIf="tile.icon === 'users'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <svg *ngIf="tile.icon === 'settings'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M5.64 18.36l4.24-4.24m4.24-4.24l4.24-4.24"/>
          </svg>
        </div>
        <h3 class="tile-title">{{ tile.title }}</h3>
        <p class="tile-description">{{ tile.description }}</p>
        <div class="tile-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14m-7-7l7 7-7 7"/>
          </svg>
        </div>
      </div>
    </div>
  </section>
</div>
